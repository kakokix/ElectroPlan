<script>
/* ElectroPlan — boîte de dérivation « comme en vrai » : placement puis tracé des fils.
   Les entrées (presse-étoupes) sont sur les 4 côtés, chaque circuit a sa zone avec ses bornes Wago,
   et les fils suivent une grille en angles droits, avec le moins de croisements possible.
   Autonome (aucune référence extérieure) : envoyé tel quel dans un Web Worker via BOXR.toString(). */
function BOXR() {
  var P = 8;                                          // pas de la grille (px) : écart entre deux fils parallèles
  var DX = [1, 0, -1, 0], DY = [0, 1, 0, -1];         // directions : 0 droite, 1 bas, 2 gauche, 3 haut
  var INWARD = { left: 0, top: 1, right: 2, bottom: 3 };
  var SY = { top: -1, bottom: 1, left: 0, right: 0 }, SX = { left: -1, right: 1, top: 0, bottom: 0 };
  var STEP = 10, BEND = 26, CROSS = 150, OVER = 4000;
  var now = (typeof performance !== 'undefined' && performance.now) ? function () { return performance.now(); } : function () { return Date.now(); };

  /* ---------------------------------------------------------------- placement
     inp = { tabSide, units: [{ titleW, nets: [{ n, labelW }] }],
             cables: [{ side, tab, labelW, w: [{ u, net }] }] }   (u : unité, net : borne de l'unité) */
  // variant : { flip: {u: 1} (bornes « mixtes » retournées), swap: [[rangée, i]] (zones voisines échangées) }
  function layout(inp, slack, variant) {
    variant = variant || {};
    var U = inp.units, C = inp.cables, nu = U.length, ui, i, j;
    var uw = [];
    for (ui = 0; ui < nu; ui++) uw.push([]);
    C.forEach(function (cb, ci) { cb.w.forEach(function (w, k) { uw[w.u].push({ ci: ci, k: k, side: cb.side, tab: !!cb.tab, net: w.net }); }); });

    // sens d'une borne : vers le haut si ses fils arrivent surtout d'en haut, sinon vers le bas
    function netFace(u, ni, row) {
      var fy = 0, up = 0, down = 0;
      uw[u].forEach(function (w) {
        if (w.net !== ni) return;
        var s = SY[w.side];
        if (s === 0 && w.tab) s = row === 0 ? 1 : -1;   // le tableau arrive par le couloir du milieu
        fy += s;
        if (s < 0) up++; else if (s > 0) down++;
      });
      var f = fy < 0 ? 'up' : (fy > 0 ? 'down' : (row === 0 ? 'down' : 'up'));
      // borne « mixte » (fils d'en haut et d'en bas) : la variante peut la retourner
      if (up && down && variant.flip && variant.flip[u]) f = f === 'up' ? 'down' : 'up';
      return f;
    }
    function mixedCount(u) {
      var m = 0;
      U[u].nets.forEach(function (nt, ni) {
        var up = 0, down = 0;
        uw[u].forEach(function (w) { if (w.net === ni) { var s = SY[w.side]; if (s === 0 && w.tab) s = 1; if (s < 0) up++; else if (s > 0) down++; } });
        if (up && down) m++;
      });
      return m;
    }
    function seqCells(u, list) {
      var cells = [], c = 2;
      list.forEach(function (ni) {
        var n = U[u].nets[ni].n, body = 2 * n + 1, hw = Math.ceil((U[u].nets[ni].labelW / 2 + 3) / P), span = Math.max(body, 2 * hw + 1);
        cells.push({ ni: ni, n: n, cs: c, span: span, off: Math.floor((span - body) / 2) + 1, hw: hw });
        c += span + 3;
      });
      return { cells: cells, end: list.length ? c - 3 : 2 };
    }
    function zoneOf(u, row, up, down) {
      if (!up) { up = []; down = []; U[u].nets.forEach(function (nt, ni) { (netFace(u, ni, row) === 'up' ? up : down).push(ni); }); }
      var titleCols = Math.ceil((U[u].titleW + 8) / P), su = seqCells(u, up), sd = seqCells(u, down), both = up.length > 0 && down.length > 0;
      var cols = Math.max(su.end, sd.end, titleCols) + 2;
      // bornes tournées vers le haut : leurs fils arrivent par-dessus, sous le titre de la zone ; plus il y en a,
      // plus il faut de rangs pour les amener (2 à 5 rangs)
      var upWires = up.reduce(function (a, ni) { return a + U[u].nets[ni].n; }, 0), ua = Math.min(5, 2 + Math.ceil(upWires / 4));
      if (!up.length) ua = 2;
      var portUp = 2 + ua;
      // deux rangées de bornes : une ligne vide entre leurs étiquettes, pour qu'elles ne se touchent pas
      return { u: u, row: row, up: up, down: down, su: su, sd: sd, cols: cols, rows: both ? portUp + 17 : (up.length ? portUp + 8 : 12),
               portUp: portUp, portDown: both ? portUp + 14 : 9, titleCols: titleCols };
    }

    // 1. rangée de chaque zone : en haut si ses fils viennent surtout du haut, en bas sinon ; puis équilibre des largeurs
    var vy = [], devx = [];
    for (ui = 0; ui < nu; ui++) {
      var sy = 0, sx = 0, nd = 0;
      uw[ui].forEach(function (w) { sy += SY[w.side]; if (!w.tab) { sx += SX[w.side]; nd++; } });
      vy.push(sy); devx.push(nd ? sx / nd : 0);
    }
    var Z = [[], []];
    for (ui = 0; ui < nu; ui++) { Z[0].push(zoneOf(ui, 0)); Z[1].push(zoneOf(ui, 1)); }
    var G = 4 + slack;
    // entrées, marges : elles ne dépendent pas des rangées
    var nS = { top: 0, bottom: 0, left: 0, right: 0 }, Tlr = 0, tabSpan = 0;
    C.forEach(function (cb) {
      nS[cb.side] += cb.w.length;
      if (cb.tab && (cb.side === 'left' || cb.side === 'right')) { Tlr += cb.w.length; tabSpan += cb.w.length + 3; }
    });
    var ML = 3 + Math.ceil(nS.left / 3) + slack, MR = 3 + Math.ceil(nS.right / 3) + slack;
    var MT = 3 + Math.ceil(nS.top / 4) + slack, MB = 3 + Math.ceil(nS.bottom / 4) + slack;
    var devSide = {};
    C.forEach(function (cb) { if (!cb.tab) devSide[cb.side] = 1; });
    var GL = C.map(function (cb, ci) {
      var n = cb.w.length, hz = cb.side === 'top' || cb.side === 'bottom', ext;
      // gaine du tableau : si des appareils entrent du même côté, on réserve la place de ses fils écartés dehors
      if (cb.tab) ext = devSide[cb.side] ? Math.max(n + 2, Math.ceil(((n - 1) * 12 + (hz ? 36 : 64)) / P)) : n + 2;
      else ext = hz ? Math.max(n + 2, Math.ceil((cb.labelW + 14) / P)) : Math.max(n + 2, 9);
      return { ci: ci, side: cb.side, n: n, ext: ext, tab: !!cb.tab, ideal: 0, first: 0 };
    });
    var sideNeedOf = function (s) { var t = 0, k = 0; GL.forEach(function (g) { if (g.side === s) { t += g.ext; k++; } }); return t + Math.max(0, k - 1) + 6; };
    var needTB = Math.max(sideNeedOf('top'), sideNeedOf('bottom'));

    var row = vy.map(function (v) { return v < 0 ? 0 : (v > 0 ? 1 : -1); });
    var rowWidth = function (r) { var w = 0, k = 0; for (var q = 0; q < nu; q++) if (row[q] === r) { w += Z[r][q].cols; k++; } return w + Math.max(0, k - 1) * G; };
    var estNX = function () { return Math.max(ML + Math.max(rowWidth(0), rowWidth(1)) + MR, needTB); };
    for (ui = 0; ui < nu; ui++) if (row[ui] < 0) row[ui] = rowWidth(0) <= rowWidth(1) ? 0 : 1;
    // équilibre : une zone change de rangée seulement si la boîte devient bien moins large
    // (chacun de ses fils qui traverserait le couloir coûte autant que la gaine du tableau est épaisse)
    var wireCost = 2 * Math.max(2, Tlr / 2);
    for (var guard = 0; guard < nu; guard++) {
      var cur = estNX(), heavy = rowWidth(0) >= rowWidth(1) ? 0 : 1, light = 1 - heavy, best = null;
      for (ui = 0; ui < nu; ui++) {
        if (row[ui] !== heavy) continue;
        row[ui] = light;
        var gain = cur - estNX();
        row[ui] = heavy;
        var sc = gain - wireCost * Math.abs(vy[ui]);
        if (gain > 0 && (!best || sc > best.sc)) best = { u: ui, sc: sc };
      }
      if (!best || best.sc <= 0) break;
      row[best.u] = light;
    }
    var rows = [[], []];
    for (ui = 0; ui < nu; ui++) rows[row[ui]].push(ui);
    // ordre dans une rangée : appareils à gauche d'abord ; puis, si le tableau arrive sur un côté, les zones qui reçoivent
    // des fils de l'autre côté du couloir loin du tableau (ces fils coupent moins de fils du tableau)
    var crossN = [], tabN = [];
    for (ui = 0; ui < nu; ui++) {
      var cx2 = 0, tn = 0;
      uw[ui].forEach(function (w) { if (w.tab) tn++; else if ((w.side === 'top' && row[ui] === 1) || (w.side === 'bottom' && row[ui] === 0)) cx2++; });
      crossN.push(cx2); tabN.push(tn);
    }
    var tabDir = inp.tabSide === 'right' ? -1 : (inp.tabSide === 'left' ? 1 : 0);
    var okey = function (q) { return devx[q] * 100 + tabDir * crossN[q] / (tabN[q] + 1); };
    rows.forEach(function (r) { r.sort(function (a, b) { return (okey(a) - okey(b)) || (a - b); }); });
    (variant.swap || []).forEach(function (sw) { var r = rows[sw[0]], i = sw[1]; if (i + 1 < r.length) { var t = r[i]; r[i] = r[i + 1]; r[i + 1] = t; } });
    var zone = [];
    for (ui = 0; ui < nu; ui++) zone.push(Z[row[ui]][ui]);

    // 2. dimensions : couloir du milieu, largeur demandée par les entrées de chaque côté
    var hRow = [0, 0];
    [0, 1].forEach(function (r) { rows[r].forEach(function (q) { hRow[r] = Math.max(hRow[r], zone[q].rows); }); });
    var X = 0;
    C.forEach(function (cb) {
      if (!cb.tab) cb.w.forEach(function (w) { if ((cb.side === 'top' && row[w.u] === 1 && rows[0].length) || (cb.side === 'bottom' && row[w.u] === 0 && rows[1].length)) X++; });
    });
    var HM = Math.max(6, Tlr + 4 + Math.ceil(X / 2), tabSpan + 2) + 2 * slack;
    var sideNeed = sideNeedOf;
    var rw = [0, 1].map(function (r) { var w = 0; rows[r].forEach(function (q) { w += zone[q].cols; }); return w + Math.max(0, rows[r].length - 1) * G; });
    var NX = Math.max(ML + Math.max(rw[0], rw[1]) + MR, sideNeed('top'), sideNeed('bottom'), 24);
    var NY = MT + hRow[0] + HM + hRow[1] + MB;
    var needY = Math.max(sideNeed('left'), sideNeed('right'), 18);
    if (NY < needY) { HM += needY - NY; NY = needY; }

    // 3. zones : réparties sur la largeur, collées en haut (rangée du haut) ou en bas (rangée du bas)
    var zpos = [];
    [0, 1].forEach(function (r) {
      var list = rows[r], k = list.length;
      if (!k) return;
      // place libre : répartie entre les zones (par défaut), ou laissée d'un côté (variante)
      var extra = NX - ML - MR - rw[r], al = (variant.align || {})[r], per, rem, x;
      if (al === 'left' || al === 'right') { per = 0; rem = 0; x = 1 + ML + (al === 'right' ? extra : 0); }
      else { per = Math.floor(extra / (k + 1)); rem = extra - per * (k + 1); x = 1 + ML + per; }
      list.forEach(function (q, idx) {
        var z = zone[q];
        zpos[q] = { zi: x, zj: r === 0 ? 1 + MT : 1 + MT + hRow[0] + HM + (hRow[1] - z.rows), z: z };
        x += z.cols + G + per + (idx < rem ? 1 : 0);
      });
    });
    var corrTop = 1 + MT + hRow[0];

    // bornes : colonnes absolues des prises, réparties sur la largeur de la zone
    var wago = [];   // wago[u][ni] = { face, row (rangée des prises), c0 (1re prise), n, hw }
    function placeWagos(q) {
      var p = zpos[q], z = p.z;
      wago[q] = wago[q] || [];
      [['up', z.up, z.portUp], ['down', z.down, z.portDown]].forEach(function (sr) {
        var list = sr[1];
        if (!list.length) return;
        var seq = seqCells(q, list), k = list.length, extra = (z.cols - 2) - seq.end, per = Math.floor(extra / (k + 1)), rem = extra - per * (k + 1);
        seq.cells.forEach(function (cell, idx) {
          var shift = per * (idx + 1) + Math.min(idx, rem);
          wago[q][cell.ni] = { face: sr[0], row: p.zj + sr[2], c0: p.zi + cell.cs + shift + cell.off, n: cell.n, hw: cell.hw };
        });
      });
    }
    for (ui = 0; ui < nu; ui++) placeWagos(ui);
    function wagoCenter(q, ni) { var g = wago[q][ni]; return [g.c0 + g.n - 1, g.row + (g.face === 'up' ? 2 : -2)]; }
    function zoneCenter(q) { var p = zpos[q]; return [p.zi + (p.z.cols - 1) / 2, p.zj + (p.z.rows - 1) / 2]; }

    // 4. entrées : position idéale près de la zone du circuit, puis rangement le long du côté
    function gapsOf(r) {
      var g = [], x = 1;
      rows[r].forEach(function (q) { var p = zpos[q]; g.push((x + p.zi - 1) / 2); x = p.zi + p.z.cols; });
      g.push((x + NX) / 2);
      return g;
    }
    function glandCenter(gl) { return gl.first + (gl.n - 1) / 2; }
    // nombre de fils du tableau qui passent à la colonne x (tableau à droite ou à gauche)
    function busAt(x) {
      var s = 0;
      if (!tabDir) return 0;
      for (var q = 0; q < nu; q++) { var zx = zoneCenter(q)[0]; if (tabDir < 0 ? zx < x : zx > x) s += tabN[q]; }
      return s;
    }
    function targetBary(ci) {
      var s = 0, k = 0;
      C[ci].w.forEach(function (w) { var c = wagoCenter(w.u, w.net); s += (C[ci].side === 'top' || C[ci].side === 'bottom') ? c[0] : c[1]; k++; });
      return k ? s / k : 0;
    }
    var crossGl = {};
    function placeGlands(useBary) {
      var bySide = { top: [], bottom: [], left: [], right: [] };
      GL.forEach(function (g) { bySide[g.side].push(g); });
      Object.keys(bySide).forEach(function (side) {
        var items = bySide[side], hz = side === 'top' || side === 'bottom';
        // appareils d'une même zone sur ce côté : répartis sur la zone, dans l'ordre de leurs bornes
        var sib = {};
        items.forEach(function (g) {
          var cb = C[g.ci];
          if (cb.tab) {
            var us = {}; cb.w.forEach(function (w) { us[w.u] = 1; });
            var ul = Object.keys(us).map(Number);
            if (hz) g.ideal = ul.reduce(function (a, q) { return a + zoneCenter(q)[0]; }, 0) / ul.length;
            else {
              var mr = ul.reduce(function (a, q) { return a + row[q]; }, 0) / ul.length;
              if (!rows[0].length) mr = 1; if (!rows[1].length) mr = 0;
              g.ideal = corrTop + HM * (0.3 + 0.4 * mr);
            }
            return;
          }
          var q = cb.w[0].u, key = q;
          (sib[key] = sib[key] || []).push(g);
        });
        Object.keys(sib).forEach(function (key) {
          var q = Number(key), list = sib[key], p = zpos[q], z = p.z, m = list.length;
          var cross = (side === 'top' && row[q] === 1 && rows[0].length) || (side === 'bottom' && row[q] === 0 && rows[1].length);
          list.forEach(function (g) { g.bary = useBary ? targetBary(g.ci) : g.ci; });
          list.sort(function (a, b) { return a.bary - b.bary || a.ci - b.ci; });
          if (hz && cross) {
            // entrée du côté opposé : elle arrive dans le couloir vertical le plus proche de la zone
            // … là où il croise le moins de fils du tableau, sans trop s'éloigner de sa zone
            var gaps = gapsOf(side === 'top' ? 0 : 1), c = zoneCenter(q)[0];
            var ranked = gaps.map(function (x) { return [Math.abs(x - c) + (CROSS / STEP) * busAt(x), x]; }).sort(function (a, b) { return a[0] - b[0]; });
            // la variante peut choisir le 2e meilleur couloir
            var pick = (variant.gap && variant.gap[list[0].ci]) ? Math.min(1, ranked.length - 1) : 0, bestG = ranked[pick][1];
            list.forEach(function (g) { crossGl[g.ci] = 1; });
            list.forEach(function (g, k) { g.ideal = bestG + (k - (m - 1) / 2) * 0.01; });
          } else if (hz) {
            list.forEach(function (g, k) { g.ideal = p.zi + (k + 0.5) * z.cols / m - 0.5; });
          } else {
            list.forEach(function (g, k) { g.ideal = p.zj + (k + 0.5) * z.rows / m - 0.5; });
          }
        });
        var lim = hz ? NX : NY, lo = 4, hi = lim - 3;
        items.sort(function (a, b) { return a.ideal - b.ideal || a.ci - b.ci; });
        var n = items.length;
        if (!n) return;
        var s = items.map(function (g) { return Math.round(g.ideal - (g.ext - 1) / 2); });
        for (var a = 0; a < n; a++) s[a] = a === 0 ? Math.max(s[a], lo) : Math.max(s[a], s[a - 1] + items[a - 1].ext + 1);
        for (a = n - 1; a >= 0; a--) s[a] = Math.min(s[a], a === n - 1 ? hi - items[a].ext + 1 : s[a + 1] - items[a].ext - 1);
        for (a = 0; a < n; a++) s[a] = a === 0 ? Math.max(s[a], lo) : Math.max(s[a], s[a - 1] + items[a - 1].ext + 1);
        items.forEach(function (g, k) { g.first = s[k] + Math.floor((g.ext - g.n) / 2); });
      });
    }
    // bornes rangées d'après la position de ce qu'elles reçoivent (moins de croisements)
    function srcX(cb) {
      var g = GL[C.indexOf(cb)];
      if (cb.side === 'left') return 1;
      if (cb.side === 'right') return NX;
      return glandCenter(g);
    }
    function orderWagos() {
      for (var q = 0; q < nu; q++) {
        var z = zpos[q].z;
        [z.up, z.down].forEach(function (list) {
          var key = {};
          list.forEach(function (ni) {
            var s = 0, k = 0;
            uw[q].forEach(function (w) { if (w.net === ni) { s += srcX(C[w.ci]); k++; } });
            key[ni] = k ? s / k : 0;
          });
          list.sort(function (a, b) { return key[a] - key[b] || a - b; });
        });
        placeWagos(q);
      }
    }
    placeGlands(false);
    orderWagos();
    placeGlands(true);
    orderWagos();

    // 5. grille : obstacles, zones, prises des bornes, départs des fils
    var Wd = NX + 2, N = Wd * (NY + 2);
    var blk = new Uint8Array(N), zid = new Int16Array(N), pnet = new Int32Array(N), pdir = new Int8Array(N);
    zid.fill(-1); pnet.fill(-1); pdir.fill(-1);
    var id = function (x, y) { return y * Wd + x; };
    var block = function (x0, y0, x1, y1) { for (var y = Math.max(0, y0); y <= Math.min(NY + 1, y1); y++) for (var x = Math.max(0, x0); x <= Math.min(NX + 1, x1); x++) blk[id(x, y)] = 1; };
    block(0, 0, NX + 1, 0); block(0, NY + 1, NX + 1, NY + 1); block(0, 0, 0, NY + 1); block(NX + 1, 0, NX + 1, NY + 1);
    block(1, 1, 2, 2); block(NX - 1, 1, NX, 2); block(1, NY - 1, 2, NY); block(NX - 1, NY - 1, NX, NY);   // vis du couvercle
    var netBase = [], gn = 0;
    for (ui = 0; ui < nu; ui++) { netBase.push(gn); gn += U[ui].nets.length; }
    var portsOf = [];
    for (i = 0; i < gn; i++) portsOf.push([]);
    for (ui = 0; ui < nu; ui++) {
      var p = zpos[ui], z = p.z;
      for (j = p.zj; j < p.zj + z.rows; j++) for (i = p.zi; i < p.zi + z.cols; i++) zid[id(i, j)] = ui;
      block(p.zi, p.zj, p.zi + z.titleCols - 1, p.zj + 1);
      U[ui].nets.forEach(function (nt, ni) {
        var g = wago[ui][ni], down = g.face === 'down', r = g.row, cEnd = g.c0 + 2 * g.n - 1, cc = g.c0 + g.n - 1;
        if (down) { block(g.c0 - 1, r - 4, cEnd, r - 1); block(cc - g.hw, r - 6, cc + g.hw, r - 5); }
        else { block(g.c0 - 1, r + 1, cEnd, r + 4); block(cc - g.hw, r + 5, cc + g.hw, r + 6); }
        block(g.c0 - 1, r, cEnd, r);
        for (var k = 0; k < g.n; k++) {
          var pn = id(g.c0 + 2 * k, r);
          blk[pn] = 0; pnet[pn] = netBase[ui] + ni; pdir[pn] = down ? 3 : 1;
          portsOf[netBase[ui] + ni].push(pn);
        }
      });
    }
    // départs : un nœud par fil au bout du presse-étoupe, et le suivant, réservés à ce fil
    var wires = [];
    GL.forEach(function (gl) {
      var cb = C[gl.ci], d = INWARD[cb.side], n = gl.n;
      var slotNode = function (k) {
        var a = gl.first + k;
        if (cb.side === 'top') return [a, 1]; if (cb.side === 'bottom') return [a, NY];
        if (cb.side === 'left') return [1, a]; return [NX, a];
      };
      // ordre des fils dans le presse-étoupe : d'après l'angle sous lequel chaque fil voit sa borne
      var c = slotNode((n - 1) / 2), ux = DY[d] !== 0 ? 1 : 0, uy = DY[d] !== 0 ? 0 : 1;
      var keyed = cb.w.map(function (w, k) {
        var t = wagoCenter(w.u, w.net), vx = t[0] - c[0], vy2 = t[1] - c[1];
        return [Math.atan2(vx * ux + vy2 * uy, vx * DX[d] + vy2 * DY[d]), k];
      }).sort(function (a, b) { return a[0] - b[0] || a[1] - b[1]; });
      gl.order = keyed.map(function (kv) { return kv[1]; });
      gl.order.forEach(function (k, slot) {
        var s = slotNode(slot), s0 = id(s[0], s[1]), s1 = id(s[0] + DX[d], s[1] + DY[d]);
        blk[s0] = 1; blk[s1] = 1;
        var w = cb.w[k];
        wires.push({ ci: gl.ci, k: k, slot: slot, u: w.u, gnet: netBase[w.u] + w.net, s0: s0, s1: s1, sdir: d });
      });
    });
    var mixed = [];
    for (ui = 0; ui < nu; ui++) mixed.push(mixedCount(ui));
    return { NX: NX, NY: NY, Wd: Wd, blk: blk, zid: zid, pnet: pnet, pdir: pdir, portsOf: portsOf, wires: wires,
             zpos: zpos, wago: wago, GL: GL, row: row, rows: rows, mixed: mixed, crossGl: Object.keys(crossGl).map(Number), netBase: netBase, slack: slack };
  }

var PFX = { lamp: 'L', sw1: 'S', sw2: 'S', vv: 'S', vrsw: 'S', swl: 'S', swt: 'S', dim: 'S', det: 'S', perm: 'S', vmcsw: 'S', bp: 'BP', bps: 'BS',

    var nA = A.length ? Math.ceil(sumCost(A) / 8) : 0;
    var nAll = Math.max(Math.ceil(sumCost(circuits) / 8), circuits.length > 1 ? 2 : 1, nA + (AC.length ? 1 : 0), Math.min(Number(opts.idMin) || 0, circuits.length));
    var gA = [], gAC = [], gi2;

    A.forEach(function (c) {

function roleOf(net) {

  if (net === 'T') return 'terre';

  if (/^MO/.test(net)) return 'montée';
  if (/^DE/.test(net)) return 'descente';
  if (net === 'FP') return 'fil pilote';
  if (net === 'PV') return 'petite vitesse';
  if (net === 'GV') return 'grande vitesse';
  if (net === 'S1') return 'sonnette 12 V';

}
