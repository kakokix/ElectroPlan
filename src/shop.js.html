<script>
/* ============================================================ ElectroPlan — liste de courses (sans DOM)
   Ce qu'il faut acheter pour l'installation en cours. On choisit une marque (ou une gamme) par famille de produits ;
   pour chaque article, la liste propose les références compatibles de la base (APP_REFS), la meilleure en premier.
   Rien n'est inventé : un article sans référence dans la base reste « à choisir ». */
var SHOP_COL = { R: 'rouge', B: 'bleu', GY: 'vert/jaune', K: 'noir', M: 'marron', O: 'orange', V: 'violet', G: 'gris' };
var SHOP_SECTIONS = [['tab', 'Tableau électrique', 'panel'], ['box', 'Boîtes de dérivation et bornes', 'box'], ['mur', 'Interrupteurs et prises', 'plug'],
                     ['enc', 'Boîtes d’encastrement et DCL', 'layers'], ['fil', 'Fils et gaines', 'cable'], ['eqp', 'Appareils à prévoir', 'zap']];
// appareil du plan → type de référence murale
var SHOP_WALL = { sw1: 'vv', vv: 'vv', sw2: 'dvv', perm: 'perm', bp: 'bp', swl: 'voyant', swt: 'voyant', dim: 'var', det: 'det', vrsw: 'vrs',
                  socket: 'pc', vmcsw: 'vmcc', bps: 'bps', heater: 'sdc', rad: 'sdc', plate: 'sdc' };
var SHOP_WALL_NAME = { vv: 'Interrupteur va-et-vient (simple allumage)', dvv: 'Double va-et-vient (double allumage)', perm: 'Permutateur', bp: 'Bouton-poussoir',
                       voyant: 'Interrupteur à voyant', var: 'Variateur', det: 'Détecteur (interrupteur automatique)', vrs: 'Interrupteur de volet roulant',
                       pc: 'Prise de courant 2P+T 16 A', vmcc: 'Commande de VMC 2 vitesses', bps: 'Bouton de sonnette', sdc: 'Sortie de câble' };
// la même borne dans les autres séries WAGO (même nombre d'entrées)
var SHOP_WAGO = { '2273': { '221-412': '2273-202', '221-413': '2273-203', '221-415': '2273-205' },
                  '2773': { '221-412': '2773-402', '221-413': '2773-403', '221-415': '2773-405', '2273-208': '2773-408' } };
var SHOP_MODS = { id: 2, dj: 1, tl: 1, mn: 1, km: 1, hz: 1, cr: 1, fpm: 1, trs: 2, son: 1, is: 1 };   // modules quand la fiche ne le dit pas
var SHOP_ROW = 13;   // modules par rangée dans les coffrets de logement courants
var SHOP_ASK = { tab: 'Choisis la marque de ton tableau (en haut) pour voir les références compatibles.',
                 mur: 'Choisis la gamme de tes interrupteurs et prises (en haut) pour voir les références compatibles.' };

function shopDefaults() { return { tab: '', gamme: '', term: '', mur: '', color: 'blanc', support: 'mac', boxBrand: '', bddBrand: '', wago: '221', gaineBrand: '', picks: {} }; }
// choix gardés avec l'installation (relus depuis le stockage : on ne garde que des valeurs simples)
function shopClean(o) {
  var d = shopDefaults();
  if (!o || typeof o !== 'object') return d;
  ['tab', 'gamme', 'mur', 'boxBrand', 'bddBrand', 'gaineBrand'].forEach(function (k) { if (typeof o[k] === 'string') d[k] = o[k].slice(0, 80); });
  if (o.term === 'vis' || o.term === 'auto') d.term = o.term;
  if (o.color === '') d.color = '';
  if (o.wago === '2273' || o.wago === '2773') d.wago = o.wago;
  if (o.support === 'cloison' || o.support === 'air') d.support = o.support;
  if (o.picks && typeof o.picks === 'object') Object.keys(o.picks).slice(0, 300).forEach(function (k) { if (typeof o.picks[k] === 'string') d.picks[String(k).slice(0, 60)] = o.picks[k].slice(0, 80); });
  return d;
}
// les marques gardent leur choix quand l'installation change (nouveau logement, exemple…) ; les choix article par article repartent de zéro
function shopKeep(o) { var d = shopClean(o); d.picks = {}; return d; }

/* lecture des désignations */
function shopTxt(r) { return r.name + ' ' + (r.specs || ''); }
function shopCal(r) { var m = /(\d+(?:[.,]\d+)?)\s?A\b/.exec(r.name) || /(\d+(?:[.,]\d+)?)\s?A\b/.exec(r.specs || ''); return m ? parseFloat(m[1].replace(',', '.')) : 0; }
function shopPoles(r) {
  var t = shopTxt(r);
  if (/1\s?P\s?\+\s?N|phase\s?\+\s?neutre|ph\s?\+\s?N\b/i.test(t)) return '1P+N';
  if (/3\s?P\s?\+\s?N/i.test(t)) return '3P+N';
  if (/\b4\s?P\b|t[ée]trapolaire|4 pôles/i.test(t)) return '4P';
  if (/\b3\s?P\b|tripolaire/i.test(t)) return '3P';
  if (/\b2\s?P\b|bipolaire|2 pôles/i.test(t)) return '2P';
  if (/\b1\s?P\b|unipolaire/i.test(t)) return '1P';
  return '';
}
function shopCurve(r) { var m = /courbe\s*([BCD])\b/i.exec(shopTxt(r)); return m ? m[1].toUpperCase() : ''; }
// raccordement : 'vis', 'auto' (automatique, sans vis), 'mixte' (l'un en haut, l'autre en bas) ou 'emb' (embrochable)
function shopTerm(r) {
  var t = shopTxt(r);
  if (/embrochable/i.test(t)) return 'emb';
  if (/automatique|\bauto\b|sans vis|sanvis|ressort|quickconnect/i.test(t)) return /\bvis\b/i.test(t.replace(/sans vis/ig, '')) ? 'mixte' : 'auto';
  if (/\bvis\b/i.test(t)) return 'vis';
  return '';
}
function shopIdType(r) {
  var m = /type\s*(AC|A\s?-?\s?si|F\s?-?\s?si|Hpi|A|F|B)(?![A-Za-z])/i.exec(shopTxt(r));
  if (!m) return '';
  var v = m[1].toUpperCase().replace(/[\s-]/g, '');
  return v === 'HPI' || v === 'FSI' ? 'F' : (v === 'ASI' ? 'A' : v);
}
var SHOP_ID_OK = { AC: ['AC', 'A', 'F'], A: ['A', 'F'], F: ['F'] };   // un type supérieur convient aussi (A protège aussi comme AC, F comme A)
function shopColorScore(r, color) {
  if (!color) return 0;
  var t = shopTxt(r).toLowerCase();
  return /blanc|white/.test(t) ? 0 : (/alu|anthracite|noir|titane|silver|vulcain|inox|bronze|\bor\b|graphite|sable|beige|ivoire|gris|dark|mat\b/.test(t) ? 2 : 1);
}
function shopBrandKey(r) { return r.brand + '|' + (r.range || ''); }
function shopRefs() { return (typeof APPDB !== 'undefined' ? APPDB.refs : []); }
// famille d'appareils modulaires qui partagent le même peigne (la gamme ne suffit pas toujours à le dire)
function shopFam(r) {
  var g = (r.range || '') + ' ' + shopTxt(r);
  if (r.brand === 'Schneider Electric') return /Resi9 XE|embrochable/i.test(g) ? 'Resi9 XE' : (/Resi9/i.test(g) ? 'Resi9 XP' : 'Acti9');
  if (r.brand === 'Hager') return /sanvis|sans vis|quickconnect|quickbusbar|bornes auto/i.test(g) ? 'sans vis' : 'à vis';
  return '';
}
// nombre de modules d'un appareil modulaire, lu dans sa fiche
function shopMods(r, kind) {
  var t = shopTxt(r), m;
  if ((m = /(\d+)\s?modules?\b/i.exec(t))) return Number(m[1]);
  if ((m = /(\d+)\s?pas de 9\s?mm/i.exec(t))) return Math.ceil(Number(m[1]) / 2);
  if ((m = /(\d+)\s?×\s?17[,.]5\s?mm/i.exec(t))) return Number(m[1]);
  if ((m = /\b(18|36|54|72)\s?mm\b/.exec(t))) return Number(m[1]) / 18;
  return SHOP_MODS[kind] || 1;
}
function shopLen(r) { var m = /(\d+)\s?m\b/.exec(r.name); return m ? Number(m[1]) : 0; }
// nombre d'entrées d'une borne WAGO (écrit dans sa désignation, sinon le dernier chiffre de la référence : 221-413 → 3)
function shopWagoN(ref, name) { var m = /(\d+)\s?conducteurs/i.exec(name || ''); if (m) return Number(m[1]); m = /(\d)$/.exec(ref || ''); return m ? Number(m[1]) : 0; }

/* marques et gammes proposées */
function shopTabBrands() {
  var by = {};
  shopRefs().forEach(function (r) { if (r.type === 'dj' || r.type === 'id') { by[r.brand] = by[r.brand] || {}; by[r.brand][r.type] = (by[r.brand][r.type] || 0) + 1; } });
  return Object.keys(by).filter(function (b) { return by[b].dj && by[b].id; }).sort(function (a, b) { return (by[b].dj + by[b].id) - (by[a].dj + by[a].id) || (a < b ? -1 : 1); });
}
// peigne : 'pn' (phase + neutre), 'p' (barre de phase seule), 'n' (barre de neutre seule)
function shopPeignePart(r) {
  var t = shopTxt(r);
  if (/\(neutre\)|isolant bleu|^peigne d.alimentation neutre/i.test(t)) return 'n';
  if (/\(phase\)|isolant marron|^peigne d.alimentation phase horizontal/i.test(t)) return 'p';
  return /phase\s?(\+|et)\s?neutre|1\s?P\s?\+\s?N|uni \+ neutre|ph\s?\+\s?N\b|répartiteur/i.test(t) ? 'pn' : '';
}
// gammes de disjoncteurs 1P+N courbe C d'une marque : d'abord celles qui ont aussi leur peigne et leurs différentiels dans la base
function shopTabRanges(brand) {
  var by = {}, R = shopRefs();
  R.forEach(function (r) {
    if (r.type !== 'dj' || r.brand !== brand || !r.range || shopPoles(r) !== '1P+N') return;
    var cv = shopCurve(r); if (cv && cv !== 'C') return;
    by[r.range] = (by[r.range] || 0) + 1;
  });
  var score = {};
  Object.keys(by).forEach(function (g) {
    var f = shopFam({ brand: brand, range: g, name: '', specs: '' });
    var hasP = R.some(function (r) { return r.type === 'peigne' && r.brand === brand && shopFam(r) === f && shopPeignePart(r) === 'pn'; });
    var hasI = R.some(function (r) { return r.type === 'id' && r.brand === brand && shopFam(r) === f; });
    // les appareils embrochables demandent un coffret de leur système : on les propose en dernier
    score[g] = by[g] + (hasP ? 10 : 0) + (hasI ? 5 : 0) - (/XE|embrochable/i.test(g) ? 8 : 0);
  });
  return Object.keys(by).filter(function (k) { return by[k] >= 3; }).sort(function (a, b) { return score[b] - score[a] || (a < b ? -1 : 1); });
}
var SHOP_MUR_TYPES = ['vv', 'dvv', 'perm', 'bp', 'voyant', 'var', 'det', 'vrs', 'pc', 'usb', 'sdc', 'rj', 'bip', 'vmcc', 'bps'];
function shopWallRanges() {
  var by = {};
  shopRefs().forEach(function (r) {
    if (SHOP_MUR_TYPES.indexOf(r.type) < 0 || !r.range) return;
    var k = shopBrandKey(r); by[k] = by[k] || { n: 0, t: {} }; by[k].n++; by[k].t[r.type] = 1;
  });
  // une gamme complète : au moins des interrupteurs et des prises
  return Object.keys(by).filter(function (k) { return by[k].n >= 8 && by[k].t.vv && by[k].t.pc; }).sort(function (a, b) { return by[b].n - by[a].n || (a < b ? -1 : 1); });
}
function shopBrandsOf(test) {
  var by = {};
  shopRefs().forEach(function (r) { if (test(r)) by[r.brand] = (by[r.brand] || 0) + 1; });
  return Object.keys(by).sort(function (a, b) { return by[b] - by[a] || (a < b ? -1 : 1); });
}
function shopBoxBrands() { return shopBrandsOf(function (r) { return r.type === 'bat' || (r.type === 'dcl' && /bo[iî]te|kit|point de centre/i.test(r.name)); }); }
function shopBddBrands() { return shopBrandsOf(function (r) { return r.type === 'bdd'; }); }
function shopGaineBrands() { return shopBrandsOf(function (r) { return r.type === 'icta' && /ICTA/.test(r.name); }); }

/* ce qu'il faut pour l'installation : une ligne par article, avec sa quantité et ce qu'elle demande */
function shopNeeds(model, lengths) {
  var out = [], idx = {};
  var add = function (sec, key, label, kind, want, qty, note) {
    if (idx[key]) { idx[key].qty += qty; return idx[key]; }
    var o = { sec: sec, key: key, label: label, kind: kind, want: want || {}, qty: qty, note: note || '' };
    idx[key] = o; out.push(o); return o;
  };
  if (!model || !model.circuits.length) return out;
  // tableau : comme sur le plan du tableau (un disjoncteur par circuit, un 2 A pour les commandes)
  model.ids.forEach(function (id) {
    if (!id.circuits.length) return;
    add('tab', 'id-' + id.cal + '-' + id.type, 'Interrupteur différentiel ' + id.cal + ' A 30 mA type ' + id.type, 'id', { cal: id.cal, typ: id.type }, 1);
  });
  var cals = {};
  model.circuits.forEach(function (c) {
    cals[c.prot.cal] = (cals[c.prot.cal] || 0) + 1;
    if (c.qc) cals[2] = (cals[2] || 0) + 1;
  });
  Object.keys(cals).map(Number).sort(function (a, b) { return a - b; }).forEach(function (cal) {
    add('tab', 'dj-' + cal, 'Disjoncteur 1P+N ' + cal + ' A courbe C', 'dj', { cal: cal }, cals[cal]);
  });
  model.circuits.forEach(function (c) {
    if (c.type === 'tl') add('tab', 'tl', 'Télérupteur 16 A, 1 contact, bobine 230 V', 'tl', {}, 1);
    if (c.type === 'mn') add('tab', 'mn', 'Minuterie modulaire', 'mn', {}, 1);
    if (c.type === 'ex') {
      if (c.exCde === 'hor') add('tab', 'hz', 'Interrupteur horaire (horloge) modulaire', 'hz', {}, 1);
      else add('tab', 'cr', 'Interrupteur crépusculaire, avec sa cellule', 'cr', {}, 1, 'Vérifie que la cellule est fournie avec l’interrupteur ; sinon, prends-la à part (même marque).');
    }
    if (c.type === 'hc') {
      add('tab', 'km-' + c.prot.cal, 'Contacteur heures creuses 2 pôles, ' + c.prot.cal + ' A au moins', 'km', { cal: c.prot.cal }, 1);
      if (c.cmd === 'inter') add('tab', 'is', 'Interrupteur modulaire (pour simuler le signal heures creuses)', 'is', {}, 1);
    }
    if (c.type === 'ch' && c.fp) add('tab', 'fpm', 'Programmateur fil pilote modulaire', 'fpm', {}, 1);
    if (c.type === 'so') { add('tab', 'trs', 'Transformateur de sonnerie 230 V / 8-12 V', 'trs', {}, 1); add('tab', 'son', 'Sonnerie modulaire 8/12 V', 'son', {}, 1); }
  });
  var nId = model.ids.filter(function (id) { return id.circuits.length; }).length;
  add('tab', 'peigne', 'Peigne d’alimentation phase + neutre (un par rangée)', 'peigne', { part: 'pn' }, nId);
  add('tab', 'coffret', 'Coffret (tableau)', null, {}, 1);
  add('tab', 'terre', 'Bornier (barrette) de terre', null, {}, 1);
  // boîtes de dérivation et bornes
  var L = buildLists(model), maxB = 0;
  Object.keys(L.boxMat).forEach(function (b) { var n = 0; Object.keys(L.boxMat[b]).forEach(function (k) { n += L.boxMat[b][k]; }); maxB = Math.max(maxB, n); });
  if (model.usedBoxes.length) add('box', 'bdd', 'Boîte de dérivation', 'bdd', { n: maxB }, model.usedBoxes.length,
                                 'Prends-la assez grande pour loger ' + (maxB > 1 ? 'tes ' + maxB + ' bornes' : 'ta borne') + ' et toutes les entrées de gaines sans tasser les fils.');
  Object.keys(L.mat.boite).sort().forEach(function (k) {
    var ref = k.replace(/^Wago /, ''), n = shopWagoN(ref, '');
    add('box', 'w-' + ref, 'Borne de connexion ' + n + ' entrées' + (/^221-6/.test(ref) ? ' (6 mm²)' : ''), 'wago', { ref: ref, n: n, big: /^221-6/.test(ref) }, L.mat.boite[k]);
  });
  // appareillage : un article par sorte d'appareil
  var wall = {}, nWall = 0, lamps = 0, eqp = { motor: 0, fan: 0, rad: 0, heater: 0 };
  var addWall = function (dv) {
    var t = SHOP_WALL[dv.kind]; if (!t) return;
    var key = t, want = { type: t }, label = SHOP_WALL_NAME[t];
    if (dv.kind === 'swl') { key = 'voyant-l'; want.lum = 1; label = 'Interrupteur à voyant lumineux'; }
    if (dv.kind === 'swt') { key = 'voyant-t'; want.tem = 1; label = 'Interrupteur à voyant témoin'; }
    if (dv.kind === 'dim' || dv.kind === 'det') {
      var f3 = dv.cde === 'var3' || dv.cde === 'det3' || (dv.wires && dv.wires.some(function (w) { return w.c === 'B'; }));
      key = t + (f3 ? '3' : '2'); want.fils = f3 ? 3 : 2; label = SHOP_WALL_NAME[t] + (f3 ? ' 3 fils (avec neutre)' : ' 2 fils (sans neutre)');
    }
    if (dv.kind === 'plate') { key = 'sdc32'; want.a32 = 1; label = 'Sortie de câble 32 A (plaque de cuisson)'; }
    if (dv.kind === 'heater' || dv.kind === 'rad') { key = 'sdc'; label = 'Sortie de câble (radiateur, chauffe-eau)'; }
    wall[key] = wall[key] || { label: label, want: want, n: 0 }; wall[key].n++; nWall++;
  };
  model.circuits.forEach(function (c) {
    c.devices.forEach(function (dv) {
      if (dv.kind === 'lamp') lamps++;
      if (eqp[dv.kind] !== undefined) eqp[dv.kind]++;
      addWall(dv);
    });
    if (c.cmdSub) c.cmdSub.devices.forEach(addWall);
    else if (c.cmdWires && c.cmd === 'mur') addWall({ kind: 'sw1' });
  });
  Object.keys(wall).forEach(function (k) { add('mur', 'm-' + k, wall[k].label, 'wall', wall[k].want, wall[k].n); });
  if (nWall) add('mur', 'plaques', 'Plaques de finition', null, {}, nWall);
  // boîtes d'encastrement et DCL
  if (nWall) add('enc', 'enc', 'Boîte d’encastrement 1 poste', 'bat', {}, nWall, 'Pour des appareils côte à côte, prends plutôt des boîtes 2 ou 3 postes.');
  if (lamps) {
    add('enc', 'dcl-boite', 'Boîte DCL de point de centre', 'dclbox', {}, lamps, 'Pour une applique au mur, prends une boîte DCL pour applique.');
    add('enc', 'dcl-fiche', 'Douille DCL (avec sa fiche)', 'dclfiche', {}, lamps, 'Elle sert d’éclairage provisoire en attendant le luminaire.');
  }
  // fils et gaines (métrage de l'onglet Fils et longueurs, marge comprise)
  var Lg = computeLengths(model, lengths);
  Lg.rows.forEach(function (r) {
    if (!r.m) return;
    var sn = Number(String(r.sec).replace(',', '.'));
    add('fil', 'fil-' + r.sec + '-' + r.c, 'Fil ' + (sn >= 6 ? 'H07V-R' : 'H07V-U') + ' ' + String(r.sec).replace('.', ',') + ' mm² ' + SHOP_COL[r.c], 'fil', { sec: r.sec, col: r.c, m: r.m }, 1,
        sn >= 10 ? 'Pour relier le différentiel au peigne (ponts du tableau).' : '');
  });
  Lg.gaines.forEach(function (g) { if (g.m) add('fil', 'gaine-' + g.d, 'Gaine ICTA Ø' + g.d, 'gaine', { d: Number(g.d), m: g.m }, 1); });
  // appareils (à choisir avec le client)
  if (eqp.motor) add('eqp', 'mvr', 'Moteur de volet roulant filaire', 'eqp', { type: 'mvr' }, eqp.motor);
  if (eqp.fan) add('eqp', 'vmc', 'Groupe VMC', 'eqp', { type: 'vmc' }, eqp.fan);
  if (eqp.rad) add('eqp', 'rad', 'Radiateur à fil pilote', 'eqp', { type: 'rad' }, eqp.rad);
  if (eqp.heater) add('eqp', 'ce', 'Chauffe-eau électrique', 'eqp', { type: 'ce' }, eqp.heater);
  add('eqp', 'daaf', 'Détecteur de fumée (DAAF)', 'eqp', { type: 'daaf' }, 1, 'Obligatoire dans chaque logement : au moins un détecteur de fumée conforme à la norme NF EN 14604.');
  return out;
}

/* références compatibles pour un article, la meilleure en premier (s = note : plus c'est bas, mieux c'est ; why = pourquoi elle convient quand même) */
function shopCandidates(need, ch, ctx) {
  ch = ch || shopDefaults(); ctx = ctx || {};
  var R = shopRefs(), w = need.want || {}, list = [], fam = ctx.fam || '';
  var push = function (r, s, why) { list.push({ r: r, s: s, why: why || '' }); };
  var famPen = function (r, p) { return fam && shopFam(r) !== fam ? p : 0; };
  // marque des boîtes : celle choisie, sinon de préférence celle de l'appareillage ou du tableau
  var boxPen = function (r, chosen) { return chosen ? (r.brand !== chosen ? 20 : 0) : (r.brand === (ch.mur || '').split('|')[0] || r.brand === ch.tab ? 0 : 1); };
  var k = need.kind;
  if (k === 'dj') {
    if (!ch.tab) return list;
    var main = ch.gamme || shopTabRanges(ch.tab)[0] || '';
    R.forEach(function (r) {
      if (r.type !== 'dj' || r.brand !== ch.tab || shopPoles(r) !== '1P+N' || shopCal(r) !== w.cal || /combin/i.test(r.name)) return;
      var cv = shopCurve(r); if (cv && cv !== 'C') return;
      var tm = shopTerm(r);
      if (ch.term === 'vis' && (tm === 'auto' || tm === 'emb')) return;
      if (ch.term === 'auto' && tm === 'vis') return;
      var s = 0, why = '';
      if (ch.gamme && r.range !== ch.gamme) { s += 100; why = 'autre gamme'; }
      else if (!ch.gamme && main && r.range !== main) s += 10;
      if (!cv) s += 5;
      push(r, s, why);
    });
  } else if (k === 'id') {
    if (!ch.tab) return list;
    var ok = SHOP_ID_OK[w.typ] || [w.typ];
    R.forEach(function (r) {
      if (r.type !== 'id' || r.brand !== ch.tab) return;
      var p = shopPoles(r); if (p && p !== '2P' && p !== '1P+N') return;
      var t = shopTxt(r); if (!/30\s?mA/i.test(t) || /400\s?V|415\s?V/.test(t)) return;
      var cal = shopCal(r); if (!cal || cal < w.cal) return;
      var ty = shopIdType(r), i = ok.indexOf(ty); if (i < 0) return;
      var s = i * 10 + (cal > w.cal ? 4 : 0) + famPen(r, 30) + (/tête de groupe/i.test(r.name) ? 1 : 0);
      push(r, s, fam && shopFam(r) !== fam ? 'autre gamme que tes disjoncteurs' : (i > 0 ? 'type ' + ty + ' : convient aussi' : (cal > w.cal ? cal + ' A : convient aussi' : '')));
    });
  } else if (k === 'peigne') {
    if (!ch.tab) return list;
    R.forEach(function (r) {
      if (r.type !== 'peigne' || r.brand !== ch.tab) return;
      var t = shopTxt(r);
