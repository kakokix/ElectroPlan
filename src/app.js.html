<script>
(function () {
  'use strict';
  var $ = function (s) { return document.querySelector(s); };
  var DRAFT_KEY = 'cabloplan:draft', SAVED_KEY = 'cabloplan:saved', STEPS_KEY = 'cabloplan:steps:';
  var UI_KEY = 'cabloplan:ui', PANEL_KEY = 'cabloplan:panel', SIDEW_KEY = 'cabloplan:sidew', ZHINT_KEY = 'cabloplan:zhint', FOCUS_KEY = 'cabloplan:focushint';
  var viewer = $('#viewer'), lists = $('#lists'), root = document.documentElement;
  var reduceMotion = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);

  function ic(name) { return '<svg class="i" aria-hidden="true"><use href="#i-' + name + '"/></svg>'; }
  function ttl(icon, text, tag) { tag = tag || 'h2'; return '<' + tag + ' class="card-title">' + ic(icon) + text + '</' + tag + '>'; }
  function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* stockage indisponible */ } }

  /* ---------------------------------------------------------------- projet */
  function normBoxes(bs) {
    var out = [];
    (Array.isArray(bs) ? bs : []).forEach(function (b, i) {
      if (!b || out.length >= 12) return;
      var id = String(b.id || ('b' + (i + 1))).replace(/[^A-Za-z0-9_-]/g, '').slice(0, 20) || ('b' + (i + 1));
      if (out.some(function (x) { return x.id === id; })) return;
      out.push({ id: id, name: String(b.name || ('Boîte ' + (i + 1))).slice(0, 40) });
    });
    if (!out.length) out.push({ id: 'b1', name: 'Boîte de dérivation' });
    return out;
  }
  function normLengths(l, maquette) {
    var d = defaultLengths(maquette);
    if (!l || typeof l !== 'object') return d;
    var num = function (v, def, max) { v = Number(v); return isFinite(v) && v >= 0 ? Math.min(v, max) : def; };
    var tb = {};
    if (l.tb && typeof l.tb === 'object') Object.keys(l.tb).slice(0, 12).forEach(function (k) { tb[String(k).slice(0, 20)] = num(l.tb[k], d.tbDef, 500); });
    return { tb: tb, tbDef: num(l.tbDef, d.tbDef, 500), dev: num(l.dev, d.dev, 200), direct: num(l.direct, d.direct, 500), margin: num(l.margin, d.margin, 100) };
  }
  function normalize(p) {
    if (!p || typeof p !== 'object') return null;
    var o = p.options || {};
    var options = { idMode: o.idMode === 'auto' ? 'auto' : 'single', idCal: Number(o.idCal) === 63 ? 63 : 40, idMin: Math.max(0, Math.min(6, parseInt(o.idMin, 10) || 0)),
                    tabSide: SIDES.indexOf(o.tabSide) >= 0 ? o.tabSide : 'right', gaines: o.gaines === 'circuit' ? 'circuit' : 'groupe' };
    var boxes = normBoxes(p.boxes);
    var out = { name: String(p.name || 'Mon installation').slice(0, 80), options: options, boxes: boxes,
                lengths: normLengths(p.lengths, options.idMode === 'single'), circuits: [] };
    (p.circuits || []).slice(0, 60).forEach(function (c) {
      if (!c || !CATALOG[c.type]) return;
      var d = defaultCircuit(c.type);
      if (c.uid) d.uid = String(c.uid).slice(0, 60);
      d.label = String(c.label || '').slice(0, 40);
      var box = c.box !== undefined ? String(c.box || '') : (c.viaBox === false ? '' : boxes[0].id);
      if (box && !boxes.some(function (b) { return b.id === box; })) box = boxes[0].id;
      d.box = box; d.viaBox = !!box;
      CATALOG[c.type].params.forEach(function (pp) {
        var v = c.params ? c.params[pp.k] : undefined;
        if (v === undefined) return;
        if (pp.options) { if (pp.options.some(function (x) { return x[0] === String(v); })) d.params[pp.k] = String(v); }
        else if (pp.text) d.params[pp.k] = String(v).slice(0, 160);
        else { var nv = parseInt(v, 10); d.params[pp.k] = Math.max(pp.min, Math.min(pp.max, isNaN(nv) ? pp.def : nv)); }
      });
      // côté par lequel chaque appareil entre dans la boîte (seulement ceux qu'on a choisis)
      if (c.entries && typeof c.entries === 'object') {
        var ent = {}, ne = 0;
        Object.keys(c.entries).forEach(function (k) { if (ne < 40 && SIDES.indexOf(c.entries[k]) >= 0) { ent[String(k).slice(0, 120)] = c.entries[k]; ne++; } });
        if (ne) d.entries = ent;
      }
      out.circuits.push(d);
    });
    return out;
  }
  var project = null;
  try { project = normalize(JSON.parse(lsGet(DRAFT_KEY))); } catch (e) { project = null; }
  if (!project) project = normalize(sampleProject());

  var TABS = { box: 'boite', tab: 'tableau', uni: 'unifilaire', list: 'fils', labels: 'etiquettes', steps: 'pas-a-pas', quiz: 'entrainement', parts: 'appareils' };
  var TAB_ORDER = ['box', 'tab', 'uni', 'list', 'labels', 'steps', 'quiz', 'parts'];
  var SVG_TABS = { box: 1, tab: 1, uni: 1, labels: 1 };
  /* mode : 'pc' ou 'mobile' (interface) ; view : vue affichée sur téléphone ('edit' = circuits, 'plans', 'list', 'steps', 'quiz') */
  var ui = { tab: 'box', zoom: { box: 'fit', tab: 'fit', uni: 'fit', labels: 'fit' }, box: null,
             mode: null, pref: 'auto', view: 'plans', plan: 'box', scroll: {}, vscroll: {}, openUid: null, stepOpen: {}, entOpen: {}, boxFocus: null, alertsOpen: undefined, lastWarn: 0 };
  ui.pref = lsGet(UI_KEY) || 'auto';
  if (ui.pref !== 'mobile' && ui.pref !== 'pc') ui.pref = 'auto';
  var hsh = (location.hash || '').replace('#', ''), hashTab = false;
  Object.keys(TABS).forEach(function (k) { if (TABS[k] === hsh) { ui.tab = k; hashTab = true; } });
  function tabView(t) { return SVG_TABS[t] ? 'plans' : t; }
  if (SVG_TABS[ui.tab]) ui.plan = ui.tab;
  ui.view = hsh === 'circuits' ? 'edit' : (hashTab ? tabView(ui.tab) : (project.circuits.length ? 'plans' : 'edit'));
  var model = null, byUid = {}, lastSvg = {};

  function saveDraft() { lsSet(DRAFT_KEY, JSON.stringify(project)); }

  /* ---------------------------------------------------------------- calcul du câblage (Web Workers)
     Chaque boîte est calculée deux fois : une esquisse rapide, affichée tout de suite,
     puis la version soignée (on essaie plusieurs dispositions), qui la remplace dès qu'elle est prête. */
  var solCache = new Map(), pending = new Set(), waiters = [], queue = [], pool = [], noWorker = false, syncBusy = false;
  var POOL = Math.max(1, Math.min(4, (navigator.hardwareConcurrency || 2) - 1));
  var Box = BOXR();
  function workerSrc() {
    return 'var BOXR = ' + BOXR.toString() + ';\nvar O = BOXR();\n' +
      'onmessage = function (e) { var d = e.data; var r = O.solve(d.inp, d.opts); postMessage({ key: d.key, q: d.q, res: r }); };';
  }
  // les versions soignées sont aussi gardées sur l'appareil (4 boîtes au plus) : à la réouverture, le plan s'affiche tout de suite
  var SOL_KEY = 'cabloplan:boxsol', SOL_VER = 'b1';
  function solId(key) { return SOL_VER + ':' + key.length + ':' + hashStr(key); }
  function storeSol(key, q, res) {
    pending.delete(key + q);
    var cur = solCache.get(key);
    if (q === 'f' || !cur) {
      if (solCache.size > 60) solCache.clear();
      solCache.set(key, { res: res, fin: q === 'f' });
    }
    if (q === 'f' && res && !res.stats.fails) {
      try {
        var saved = JSON.parse(lsGet(SOL_KEY) || '[]').filter(function (s) { return s && s.id !== solId(key); });
        saved.unshift({ id: solId(key), res: res });
        lsSet(SOL_KEY, JSON.stringify(saved.slice(0, 4)));
      } catch (e) { /* stockage plein ou indisponible : tant pis */ }
    }
  }
  function savedSol(key) {
    try {
      var id = solId(key), s = JSON.parse(lsGet(SOL_KEY) || '[]').filter(function (x) { return x && x.id === id; })[0];
      return s && s.res && s.res.wires ? s.res : null;
    } catch (e) { return null; }
  }
  var workerUrl = null;
  function makeWorker() {
    var w = new Worker(workerUrl);
    w.job = null;
    w.onmessage = function (e) { w.job = null; storeSol(e.data.key, e.data.q, e.data.res); pump(); onSolved(); };
    w.onerror = function (ev) {
      // calcul en arrière-plan indisponible ici : on bascule sur un calcul dans la page
      if (ev && ev.preventDefault) ev.preventDefault();
      var job = w.job; w.job = null;
      pool = pool.filter(function (x) { return x !== w; });
      try { w.terminate(); } catch (err) { /* déjà arrêté */ }
      if (job) queue.unshift(job);
      if (!pool.length) noWorker = true;
      pump();
    };
    return w;
  }
  function setupPool() {
    try {
      workerUrl = URL.createObjectURL(new Blob([workerSrc()], { type: 'text/javascript' }));
      for (var i = 0; i < POOL; i++) pool.push(makeWorker());
    } catch (e) { pool = []; noWorker = true; }
  }
  // un calcul qui ne sert plus (boîte modifiée entre-temps) est arrêté pour laisser la place au nouveau
  function dropStale(want) {
    pool = pool.map(function (w) {
      if (!w.job || want[w.job.key]) return w;
      pending.delete(w.job.key + w.job.q);
      try { w.terminate(); } catch (err) { /* déjà arrêté */ }
      try { return makeWorker(); } catch (err) { return null; }
    }).filter(Boolean);
    if (!pool.length && !noWorker) noWorker = true;
  }
  setupPool();
  function pump() {
    if (noWorker) {
      if (syncBusy || !queue.length) return;
      syncBusy = true;
      setTimeout(function () {
        var job = queue.shift();
        if (job) {
          var o = Object.assign({}, job.opts);
          if (!o.draft) o.budget = 1200;
          storeSol(job.key, job.q, Box.solve(job.inp, o));
        }
        syncBusy = false;
        onSolved();
        pump();
      }, 30);
      return;
    }
    pool.forEach(function (w) {
      if (w.job || !queue.length) return;
      w.job = queue.shift();
      w.postMessage(w.job);
    });
  }
  var boxMemo = { rev: -1, all: null, byBox: {} };
  function boxOf(boxId) {
    if (boxMemo.rev !== modelRev) boxMemo = { rev: modelRev, all: null, byBox: {} };
    if (!boxMemo.byBox[boxId]) {
      var B = boxModel(model, boxId);
      boxMemo.byBox[boxId] = { B: B, key: boxKey(B) };
    }
    return boxMemo.byBox[boxId];
  }
  function allBoxKeys() {
    if (boxMemo.rev !== modelRev || !boxMemo.all) {
      var want = {};
      model.usedBoxes.forEach(function (b) { want[boxOf(b.id).key] = 1; });
      boxMemo.all = want;
    }
    return boxMemo.all;
  }
  function requestBox(bm) {
    // on oublie les calculs en attente qui ne servent plus (circuit modifié entre-temps)
    var want = allBoxKeys(), key = bm.key, have = solCache.get(key);
    queue = queue.filter(function (j) { if (want[j.key]) return true; pending.delete(j.key + j.q); return false; });
    if (!noWorker) dropStale(want);
    if (!have && !pending.has(key + 'd')) { pending.add(key + 'd'); queue.push({ key: key, q: 'd', inp: bm.B.inp, opts: { draft: true } }); }
    if ((!have || !have.fin) && !pending.has(key + 'f')) { pending.add(key + 'f'); queue.push({ key: key, q: 'f', inp: bm.B.inp, opts: {} }); }
    queue.sort(function (a, b) { return (a.q === 'd' ? 0 : 1) - (b.q === 'd' ? 0 : 1); });
    pump();
  }
  function onSolved() {
    if (ui.tab === 'box') renderBoxView();
    var still = [];
    waiters.forEach(function (w) { if (!w()) still.push(w); });
    waiters = still;
  }
  function boxState(boxId) {
    var bm = boxOf(boxId), have = solCache.get(bm.key);
    if (!have || !have.fin) { var sv = savedSol(bm.key); if (sv) { have = { res: sv, fin: true }; solCache.set(bm.key, have); } }
    if (!have || !have.fin) requestBox(bm);
    return { have: have, total: 1, drafts: have ? 1 : 0, finals: have && have.fin ? 1 : 0 };
  }
  function boxSvgFrom(st, boxId) { return renderBox(model, boxId, st.have.res); }
  function ensureBoxSvg(boxId) {
    // pour les téléchargements : on attend la version soignée
    return new Promise(function (resolve) {
      var check = function () { var st = boxState(boxId); if (st.finals === st.total) { resolve(boxSvgFrom(st, boxId)); return true; } return false; };
      if (!check()) waiters.push(check);
    });
  }
  function curBox() {
    var ub = model.usedBoxes;
    if (!ub.length) return null;
    if (!ub.some(function (b) { return b.id === ui.box; })) ui.box = ub[0].id;
    return ui.box;
  }

  /* ---------------------------------------------------------------- rendu des vues */
  var modelRev = 0, shownSig = '';
  function showBusy(t) { $('#busytxt').textContent = t; $('#busy').hidden = false; }
  function hideBusy() { $('#busy').hidden = true; }
  function showSvg(kind, svg) {
    lastSvg[kind] = svg;
    if (ui.tab !== kind) return;
    // chaque plan garde sa position de défilement quand on change d'onglet
    var prev = viewer.dataset.kind, changed = prev !== kind;
    if (changed && prev && SVG_TABS[prev]) ui.vscroll[prev] = [viewer.scrollLeft, viewer.scrollTop];
    viewer.innerHTML = svg;
    viewer.dataset.kind = kind;
    viewer.classList.remove('dim');
    applyZoom();
    if (changed) { var s = ui.vscroll[kind]; viewer.scrollLeft = s ? s[0] : 0; viewer.scrollTop = s ? s[1] : 0; }
  }
  var EMPTY_ACTIONS = '<button type="button" class="primary" data-do="add"><svg class="i" aria-hidden="true"><use href="#i-plus"/></svg>Ajouter un circuit</button><button type="button" data-do="gen"><svg class="i" aria-hidden="true"><use href="#i-house"/></svg>Logement selon la norme…</button>';
  function emptyHtml(title, txt, actions) {
    return '<div class="empty"><div><span class="empty-ic">' + ic('sparkles') + '</span><strong>' + esc(title) + '</strong><span>' + esc(txt) + '</span>' + (actions ? '<div class="row-actions">' + actions + '</div>' : '') + '</div></div>';
  }
  function showMessage(title, txt, actions) {
    var prev = viewer.dataset.kind;
    if (prev && SVG_TABS[prev]) ui.vscroll[prev] = [viewer.scrollLeft, viewer.scrollTop];
    viewer.innerHTML = emptyHtml(title, txt, actions);
    viewer.dataset.kind = '';
    viewer.classList.remove('dim', 'can-pan');
  }
  function emptyMsg() { return ['Ta boîte est vide', 'Dis ce qu\'il y a dans ta boîte de dérivation : ajoute les circuits qui y passent, ou crée un logement selon la norme.']; }
  function emptyState() { var m = emptyMsg(); showMessage(m[0], m[1], EMPTY_ACTIONS); hideBusy(); }
  function emptyListHtml() { var m = emptyMsg(); return emptyHtml(m[0], m[1], EMPTY_ACTIONS); }
  // les vues en liste (fils, pas à pas, entraînement) partagent un seul conteneur : chacune retrouve sa position de défilement
  function setLists(h) {
    var same = lists.dataset.tab === ui.tab, top = lists.scrollTop;
    if (!same && lists.dataset.tab) ui.scroll[lists.dataset.tab] = top;
    lists.innerHTML = h;
    lists.dataset.tab = ui.tab;
    lists.scrollTop = same ? top : (ui.scroll[ui.tab] || 0);
  }
  function renderBoxPick() {
    var bp = $('#boxpick'), ub = model ? model.usedBoxes : [];
    if (ui.tab !== 'box' || ub.length < 2) { bp.hidden = true; syncToolbar(); return; }
    var cur = curBox();
    bp.hidden = false;
    bp.innerHTML = '<span class="lbl">Boîte :</span>' + ub.map(function (b) {
      return '<button type="button" data-box="' + esc(b.id) + '" aria-pressed="' + (b.id === cur ? 'true' : 'false') + '">' + esc(b.name) + ' <small>(' + b.circuits.length + ')</small></button>';
    }).join('');
    syncToolbar();
  }
  // la barre au-dessus du plan ne s'affiche que si elle a quelque chose à montrer
  function syncToolbar() {
    var tb = $('#toolbar'), ex = $('#exportctl');
    tb.hidden = $('#boxpick').hidden && (ex.parentNode !== tb || ex.hidden);
  }
  function renderBoxView() {
    if (!model) return;
    renderBoxPick();
    if (!model.circuits.length) { shownSig = ''; return emptyState(); }
    var bid = curBox();
    if (!bid) {
      hideBusy(); shownSig = '';
      showMessage('Rien dans la boîte', 'Aucun circuit ne passe par une boîte de dérivation. Choisis une boîte dans la carte d\'un circuit.');
      return;
    }
    var st = boxState(bid);
    if (st.drafts < st.total) {
      showBusy('Dessin de la boîte…');
      if (viewer.dataset.kind === 'box') viewer.classList.add('dim');
      else showMessage('Dessin en cours', 'Les bornes Wago sont placées et les fils tracés pour qu\'ils se croisent le moins possible.');
      shownSig = '';
      return;
    }
    var fin = st.finals === st.total, sig = modelRev + '|' + bid + (fin ? 'f' : 'd');
    if (fin) hideBusy(); else showBusy('Amélioration du câblage…');
    if (sig === shownSig && viewer.dataset.kind === 'box') return;
    shownSig = sig;
    showSvg('box', boxSvgFrom(st, bid));
    applyFocus();
    // astuce, une seule fois
    if (fin && boxUnits(model, bid).length > 1 && !lsGet(FOCUS_KEY)) { lsSet(FOCUS_KEY, '1'); toast('Astuce : touche un circuit sur le plan pour le voir seul.'); }
  }
  function renderSvgTab(kind, fn) {
    hideBusy();
    if (!model.circuits.length) return emptyState();
    var sig = modelRev + '|' + kind;
    if (viewer.dataset.kind === kind && viewer.dataset.sig === sig) return applyZoom();
    showSvg(kind, fn(model));
    viewer.dataset.sig = sig;
  }
  function swatch(c) { return '<span class="sw ' + c + '" style="background:' + (c === 'GY' ? '' : WC[c]) + '"></span>'; }

  /* -- fils, longueurs et matériel */
  function lengthInputs() {
    var Lg = project.lengths, h = '<div class="len-grid">';
    var boxes = model.usedBoxes;
    if (boxes.length) {
      boxes.forEach(function (b) {
        var v = Lg.tb[b.id] !== undefined ? Lg.tb[b.id] : Lg.tbDef;
        h += '<label>Tableau → ' + esc(b.name) + ' (m)<input type="number" min="0" max="500" step="0.5" inputmode="decimal" data-len="tb" data-box="' + esc(b.id) + '" value="' + v + '"></label>';
      });
      h += '<label>Boîte → chaque appareil (m)<input type="number" min="0" max="200" step="0.5" inputmode="decimal" data-len="dev" value="' + Lg.dev + '"></label>';
    }
    if (model.circuits.some(function (c) { return !c.viaBox; })) h += '<label>Tableau → appareil direct (m)<input type="number" min="0" max="500" step="0.5" inputmode="decimal" data-len="direct" value="' + Lg.direct + '"></label>';
    h += '<label>Marge pour les raccordements (%)<input type="number" min="0" max="100" step="5" inputmode="numeric" data-len="margin" value="' + Lg.margin + '"></label></div>';
    return h;
  }
  function lengthResults() {
    var R = computeLengths(model, project.lengths), h = '';
    if (ui.mode === 'mobile') {
      // téléphone : la section passe sous la couleur, pour tenir en trois colonnes
      h += '<div class="tbl-wrap"><table class="tight"><thead><tr><th>Fil</th><th>Longueur</th><th>À acheter</th></tr></thead><tbody>';
      R.rows.forEach(function (r) { h += '<tr><td class="wn">' + swatch(r.c) + esc(WN[r.c]) + '<br><small class="sec">' + r.sec + ' mm²</small></td><td class="num">' + r.m + ' m</td><td>' + esc(r.rolls) + '</td></tr>'; });
    } else {
      h += '<div class="tbl-wrap"><table><thead><tr><th>Fil</th><th>Section</th><th>Longueur</th><th>À acheter</th></tr></thead><tbody>';
      R.rows.forEach(function (r) { h += '<tr><td class="wn">' + swatch(r.c) + esc(WN[r.c]) + '</td><td class="wn">' + r.sec + ' mm²</td><td class="num">' + r.m + ' m</td><td>' + esc(r.rolls) + '</td></tr>'; });
    }
    h += '</tbody></table></div>';
    if (R.gaines.length) {
      h += '<div class="tbl-wrap" style="margin-top:10px"><table><thead><tr><th>Gaine</th><th>Longueur</th></tr></thead><tbody>';
      R.gaines.forEach(function (g) { h += '<tr><td class="wn">ICTA Ø' + g.d + '</td><td class="num">' + g.m + ' m</td></tr>'; });
      h += '</tbody></table></div>';
    }
    h += '<p class="note" style="margin-top:8px">Total ' + R.total + ' m de fil, marge comprise. Les ponts du tableau comptent 30 cm chacun.</p>';
    return h;
  }
  function renderListView() {
    hideBusy();
    if (!model.circuits.length) { setLists(emptyListHtml()); return; }
    var L = buildLists(model), h = '', multi = model.multiBox, mob = ui.mode === 'mobile';
    h += '<section>' + ttl('ruler', 'Longueurs à prévoir') + '<p class="note">Mets tes distances : le métrage se met à jour tout seul.</p>' + lengthInputs() + '<div id="lenres">' + lengthResults() + '</div></section>';
    h += '<section>' + ttl('cable', 'Fils qui partent du tableau') + '<p class="note">Un numéro par fil : repère-le aux deux bouts.</p>';
    if (mob) {
      // téléphone : une carte par fil, avec son repère comme sur le plan
      h += '<ul class="wcards">' + L.tab.map(function (r) {
        return '<li class="wcard"><span class="wnum" aria-label="Fil numéro ' + r.num + '">' + r.num + '</span><div class="wbody">' +
          '<div class="w1">' + swatch(r.c) + '<b>' + esc(WN[r.c]) + '</b><span>' + secTxt(r.sec) + ' mm²</span><span class="wq">' + esc(r.q) + '</span></div>' +
          '<div class="w2">' + esc(r.circuit + ' · ' + r.role) + '</div>' +
          '<div class="w3"><span>' + esc(r.from) + '</span><span aria-hidden="true">→</span><span>' + esc(r.to) + '</span></div></div></li>';
      }).join('') + '</ul></section>';
    } else {
      h += '<div class="tbl-wrap"><table><thead><tr><th>N°</th><th>Fil</th><th>Section</th><th>Circuit</th><th>Rôle</th><th>Côté tableau</th><th>Arrivée</th></tr></thead><tbody>';
      L.tab.forEach(function (r) {
        h += '<tr><td class="num">' + r.num + '</td><td class="wn">' + swatch(r.c) + esc(WN[r.c]) + '</td><td class="wn">' + secTxt(r.sec) + ' mm²</td><td>' + esc(r.q + ' · ' + r.circuit) + '</td><td>' + esc(r.role) + '</td><td>' + esc(r.from) + '</td><td>' + esc(r.to) + '</td></tr>';
      });
      h += '</tbody></table></div></section>';
    }
    if (L.dev.length) {
      h += '<section>' + ttl('plug', 'Câbles entre la boîte et les appareils');
      if (mob) {
        h += '<ul class="wcards">' + L.dev.map(function (r) {

  if (window.ResizeObserver) new ResizeObserver(fitTabsSoon).observe($('#work'));
  window.addEventListener('resize', fitTabsSoon);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitTabsSoon);

  /* -- ordinateur : volet des circuits repliable et redimensionnable */
  function togglePanel(open) {
    var closed = open === undefined ? root.getAttribute('data-panel') !== 'closed' : !open;
    if (closed) root.setAttribute('data-panel', 'closed'); else root.removeAttribute('data-panel');
    lsSet(PANEL_KEY, closed ? 'closed' : 'open');
    var b = $('#btn-panel');
    b.setAttribute('aria-expanded', closed ? 'false' : 'true');
    b.title = (closed ? 'Afficher' : 'Masquer') + ' le volet des circuits (P)';
  }
  (function () {
    var rz = $('#resizer'), drag = null;
    function setW(w) { w = Math.max(300, Math.min(640, Math.round(w))); root.style.setProperty('--side-w', w + 'px'); return w; }
    rz.addEventListener('pointerdown', function (e) {
      if (e.button !== 0) return;
      drag = { x: e.clientX, w: $('#panel').getBoundingClientRect().width };
      try { rz.setPointerCapture(e.pointerId); } catch (err) { /* sans capture */ }
      rz.classList.add('drag');
      e.preventDefault();
    });
    rz.addEventListener('pointermove', function (e) { if (drag) setW(drag.w + e.clientX - drag.x); });
    function end() { if (!drag) return; drag = null; rz.classList.remove('drag'); lsSet(SIDEW_KEY, String(Math.round($('#panel').getBoundingClientRect().width))); }
    rz.addEventListener('pointerup', end);
    rz.addEventListener('pointercancel', end);
    rz.addEventListener('dblclick', function () { setW(400); lsSet(SIDEW_KEY, '400'); });
    rz.addEventListener('keydown', function (e) {
      if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
      e.preventDefault();
      lsSet(SIDEW_KEY, String(setW($('#panel').getBoundingClientRect().width + (e.key === 'ArrowRight' ? 20 : -20))));
    });
  })();

  /* -- boutons d'action, où qu'ils soient (en-tête, menu, messages vides) */
  function openAdd(opener) {
    if (ui.mode === 'mobile') { if (ui.view !== 'edit') goView('edit'); openOv('ov-add', opener || $('#fab-add')); return; }
    if (root.getAttribute('data-panel') === 'closed') togglePanel(true);
    openOv('ov-add', opener && opener.id === 'btn-add' ? opener : $('#btn-add'));
  }
  document.addEventListener('click', function (e) {
    if (e.target.closest('[data-close]')) { closeOv(); return; }
    var b = e.target.closest('[data-do]');
    if (!b || b.disabled) return;
    var a = b.dataset.do;
    if (a === 'add') openAdd(b);
    else if (a === 'gen') { renderGen(); openOv('ov-gen', b); }
    else if (a === 'saved') { renderSaved(); openOv('ov-saved', b); }
    else if (a === 'save') { closeOv(false); doSave(); }
    else if (a === 'menu') openOv('ov-menu', b);
    else if (a === 'dl') openOv('ov-dl', b);
    else if (a === 'keys') openOv('ov-keys', b);
    else if (a === 'parts') { closeOv(false); openParts(); }
    else if (a === 'panel') togglePanel();
    else if (a === 'alerts') {
      ui.alertsOpen = true;
      goView('edit');
      var d = $('#alerts details'); if (d) d.open = true;
      $('#alerts').scrollIntoView({ block: 'start', behavior: reduceMotion ? 'auto' : 'smooth' });
    }
  });

  /* -- raccourcis clavier */
  function typing(t) {
    if (!t || !t.tagName) return false;
    if (t.isContentEditable || t.tagName === 'TEXTAREA' || t.tagName === 'SELECT') return true;
    return t.tagName === 'INPUT' && !/^(checkbox|radio|button|submit|reset|range)$/i.test(t.type);
  }
  document.addEventListener('keydown', function (e) {
    if ((e.ctrlKey || e.metaKey) && !e.altKey && (e.key === 's' || e.key === 'S')) { e.preventDefault(); closeOv(false); doSave(); return; }
    if (e.ctrlKey || e.metaKey || e.altKey || e.defaultPrevented || OV.el || typing(e.target)) return;
    var k = e.key;
    if (/^[1-8]$/.test(k)) { e.preventDefault(); setTab(TAB_ORDER[+k - 1]); return; }
    if (k === '/') { e.preventDefault(); if (ui.mode === 'pc' && $('#hq')) { $('#hq').focus(); $('#hq').select(); } else openParts(); return; }
    if (SVG_TABS[ui.tab] && (k === '+' || k === '=')) { e.preventDefault(); zoomBy(1.25); return; }
    if (SVG_TABS[ui.tab] && (k === '-' || k === '_' || k === '−')) { e.preventDefault(); zoomBy(1 / 1.25); return; }
    if (SVG_TABS[ui.tab] && k === '0') { e.preventDefault(); zoomFit(); return; }
    if (k === 'n' || k === 'N') { e.preventDefault(); openAdd(); return; }
    if ((k === 'p' || k === 'P') && ui.mode === 'pc') { e.preventDefault(); togglePanel(); return; }
    if (k === '?') { e.preventDefault(); openOv('ov-keys', document.querySelector('.kbtn')); }
  });

  /* ---------------------------------------------------------------- démarrage */
  renderCatalog();
  if (root.getAttribute('data-panel') === 'closed') togglePanel(false);
  applyMode(true);
  refreshAll();
  renderSaved();
  if (window.claude && typeof window.claude.use === 'function') {
    // page servie seule (pas dans le cadre de Claude) : le navigateur peut télécharger lui-même
    window.claude.use('downloads').then(function (d) { downloads = d || (FRAMED ? null : browserDownloads); updateExportButtons(); }).catch(function () {});
    window.claude.use('sample').then(function (smp) { parts.sample = smp || null; if (ui.tab === 'parts') updatePartsList(); }).catch(function () {});
    Promise.all([window.claude.use('db'), window.claude.use('user')]).then(function (r) {
      var db = r[0], user = r[1];
      if (!db || !user) return null;
      return user.id().then(function (uid) {
        if (!uid) return;
        store.db = db; store.uid = uid; store.mode = 'db';
        renderSaved();
        watchShared(db);
        user.isOwner().then(function (v) { parts.owner = !!v; if (ui.tab === 'parts') updatePartsFiche(); });
        user.canEdit().then(function (v) { parts.canEdit = !!v; });
        if (steps.key) { var k = steps.key; steps.key = null; if (ui.tab === 'steps') renderStepsView(); else loadSteps(k); }
      });
    }).catch(function () {});
  }
})();

</script>
